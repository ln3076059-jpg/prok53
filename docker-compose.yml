services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: driver_safety
      MYSQL_USER: safety
      MYSQL_PASSWORD: safety
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro
      - ./uploads:/app/uploads
      - ./evidence:/app/evidence
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

