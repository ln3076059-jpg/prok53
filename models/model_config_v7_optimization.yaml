experiment_id: ROADWATCH_V7_OPTIMIZATION
activation_state: DEVELOPMENT_ONLY_NOT_VALIDATED
dataset_role: DEVELOPMENT_ONLY_ITERATIVE
development_subjects: [gB-9, gZ-36, gC-14]
forbidden_consumed_holdouts: [gZ-37, gE-28]

backbone:
  architecture: FROZEN_RESNET18_BIDIRECTIONAL_GRU
  pretrained_weights: IMAGENET1K_V1
  training_stride: 2
  hidden_size: 64
  epochs: 25
  batch_size: 16
  learning_rate: 0.0005
  seed: 8407

ablation_variants:
  - id: V7_B_COARSE_OBJECTIVE
    architecture: hierarchical
    sequence_length: 9
    coarse_loss_mode: none
    fine_loss_mode: sqrt_inverse
    coarse_loss_coefficient: 2.0
    fine_loss_coefficient: 1.0
    hard_negative_mining: false
    hypothesis: An unweighted, emphasized coarse objective preserves observed SAFE/OTHER priors.
  - id: V7_C_HARD_NEGATIVES
    architecture: hierarchical
    sequence_length: 9
    coarse_loss_mode: none
    fine_loss_mode: sqrt_inverse
    coarse_loss_coefficient: 2.0
    fine_loss_coefficient: 1.0
    hard_negative_mining: true
    miner_epochs: 8
    miner_minimum_phone_probability: 0.50
    hard_negative_weight: 2.0
    hypothesis: Verified training-only SAFE/OTHER phone errors suppress false activation.
  - id: V7_D_BINARY_GATE
    architecture: binary_gate
    sequence_length: 9
    hard_negative_mining: false
    hypothesis: PHONE versus NON_PHONE first reduces class competition at the coarse boundary.
  - id: V7_E_LONGER_CONTEXT
    architecture: hierarchical
    sequence_length: 17
    coarse_loss_mode: none
    fine_loss_mode: sqrt_inverse
    coarse_loss_coefficient: 2.0
    fine_loss_coefficient: 1.0
    hard_negative_mining: false
    hypothesis: A longer temporal window improves subject-invariant motion context.

event_decision:
  fixed_action_threshold: 0.80
  threshold_provenance: PRE_REGISTERED_FROM_V5; NOT_TUNED_ON_V7_OUTER_LABELS
  minimum_positive_samples: 2
  release_ratio: 0.65
  merge_gap_seconds: 2.0
  fixed_negative_evidence_margin: 0.15
  margin_provenance: PRE_REGISTERED_BEFORE_V7_MODEL_RESULTS

selection:
  maximum_false_alarms_per_minute: 0.30
  maximum_worst_subject_false_alarms_per_minute: 0.60
  minimum_safe_driving_recall: 0.20
  primary_metric: event_f1
  tie_breakers: [event_recall, lower_false_alarms_per_minute]
