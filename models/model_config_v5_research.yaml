experiment_id: ROADWATCH_V5_RESEARCH
model_version: ROADWATCH_V5_TINY_TEMPORAL_CNN_001
activation_state: DEVELOPMENT_ONLY_NOT_VALIDATED
dataset_role: DEVELOPMENT_ONLY
development_subjects: [gB-9, gZ-36, gC-14]
forbidden_consumed_holdouts: [gZ-37, gE-28]

video_action:
  architecture: TinyTemporalCNN
  input_view: BODY
  driver_roi_xyxy: [0.0, 0.10, 0.65, 0.95]
  image_size: 64
  sequence_length: 5
  sample_period_seconds: 0.5
  training_stride: 2
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  seed: 5305
  evaluation: LEAVE_ONE_SUBJECT_OUT
  unknown_policy: LOW_CONFIDENCE_ABSTENTION

resnet_gru_action:
  architecture: FROZEN_RESNET18_BIDIRECTIONAL_GRU
  pretrained_weights: IMAGENET1K_V1
  source_rgb_cache_size: 64
  encoder_input_size: 112
  embedding_dim: 512
  sequence_length: 9
  training_stride: 2
  hidden_size: 64
  epochs: 25
  batch_size: 64
  learning_rate: 0.0005
  seed: 6305
  evaluation: LEAVE_ONE_SUBJECT_OUT
  sampling: SQRT_INVERSE_CLASS_WEIGHTED_WITH_REPLACEMENT
  backbone_finetuning: false

event_decision:
  action_threshold_grid: [0.40, 0.50, 0.60, 0.70, 0.80]
  minimum_positive_samples: 2
  release_ratio: 0.65
  merge_gap_seconds: 2.0
  action_only_status: NEEDS_REVIEW
  object_plus_action_status: PENDING
  automatic_violation: false

selection:
  maximum_false_alarms_per_minute: 0.30
  primary_metric: event_f1
  tie_breakers: [event_recall, lower_false_alarms_per_minute]
