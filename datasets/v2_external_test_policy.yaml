schema_version: 1
dataset_role: EXTERNAL_TEST
require_identity_manifest: true
require_full_system_evaluation: true
require_sequence_intake: true
require_canonical_sequence_annotations: true
require_development_lineage_lock: true
required_fields:
  - sample_id
  - dataset_role
  - source_id
  - camera_id
  - video_id
  - vehicle_id
  - person_id
  - video_path
  - sha256
  - annotation_path
  - annotation_sha256
  - conditions
  - human_review_status
  - reviewer_id
  - reviewer_type
  - reviewed_at
  - proposed_role
  - capture_session_id
  - physical_vehicle_group_id
  - person_group_ids
  - prior_usage
  - model_predictions_seen
  - rights_evidence_path
  - rights_evidence_sha256
  - independence_evidence_path
  - independence_evidence_sha256
required_condition_coverage:
  - daylight
  - night
  - low_light
  - rain
  - glare
  - reflection
  - windshield_reflection
  - motion_blur
  - video_compression
  - partial_occlusion
  - oblique_view
  - dark_windshield
  - different_camera_angle
  - different_cabin_geometry
disjoint_dimensions:
  - sha256
  - source_id
  - camera_id
  - video_id
  - vehicle_id
  - person_id
  - capture_session_id
  - physical_vehicle_group_id
  - person_group_ids
minimum_independent_groups:
  source_id: 2
  camera_id: 3
  video_id: 12
  physical_vehicle_group_id: 8
  person_group_ids: 8
policy:
  - Every video and annotation must be human-reviewed before freezing.
  - Each annotation binds a canonical human-reviewed sequence JSON with full-timeline context.
  - Additional cabins use additional_sequence_annotations path/SHA references to canonical sequences.
  - Development lineage completeness must be human-attested and frozen before official external freeze.
  - External sources and cameras must not appear in training, validation, or calibration data.
  - A frozen artifact records integrity and isolation; it does not claim model accuracy.
